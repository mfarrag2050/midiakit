# .github/workflows/ci.yml — سلسلة CI الرئيسيّة (31 بوابة + 3 mkau).
#
# **عقد mkci §9 (GATE-2LAYER · 2026-09-11 · b4ce12e):**
# «CI يشغّل السلسلة داخل الحاوية بلا شروط env — لا SKIP، لا tolerance.»
# المرجع Linux فقط، مُوَلَّد داخل `node:20.18.1-bookworm-slim`.
# CI هنا يستعمل نفس الحاوية → بايتات مطابقة لـ`bin/mk-ci` محلّيّاً.
#
# **verify:snapshot · verify:plan-values · verify:breaking-video** تفحص
# `process.platform === 'linux'` وتفشل إن ≠ linux. الحاوية = Debian
# bookworm = linux → تمرّ.
#
# **check:docker-context (GATE-2LAYER)**: mk أضاف branch جديداً — عند
# غياب docker binary (حاوية · CI · dev بلا docker)، الفحص يخرج ✓ مع
# رسالة صريحة. لا حاجة لتصفية من الحلقة بعد الآن.
#
# **سياسة دائمة (قرار مالك · 20-CI-BUILD جواب (4)):** جمع كلّ الإخفاقات،
# لا `bash -e` fail-fast. **لا تُعِد هذا إلى fail-fast.**
#
# **الأسرار — الأسماء فقط:**
#   • `CI_POSTGRES_BOOTSTRAP_PASSWORD` — postgres service.
#   • `CI_SESSION_JWT_SECRET` (32+ chars) — verify:auth.
#   • `CI_PLATFORM_JWT_SECRET` (32+ chars) — verify:auth.
#   • `CI_AI_KEY_ENCRYPTION_KEY` (64 hex chars = 32 bytes) — verify:auth.

name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pnpm test (31 بوابة داخل حاوية Linux) + 3 mkau
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ── الحاوية (عقد §9 · GATE-2LAYER) ─────────────────────────
    container:
      image: node:20.18.1-bookworm-slim
    # داخل container mode، GH Actions افتراضاً `sh -e {0}` لا bash — يكسر
    # herestrings و[[]] وbash arrays. نفرض bash لكلّ خطوة `run:`.
    defaults:
      run:
        shell: bash

    # ── خدمات ──────────────────────────────────────────────────
    # postgres: hostname `postgres` (سيبلينغ للحاوية في نفس شبكة الوظيفة).
    # redis: hostname `redis` (نفس المبدأ). داخل الحاوية لا يوجد 127.0.0.1
    # للـservices — نستعمل أسماء الخدمة بحسب alias التلقائيّ.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediakit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_BOOTSTRAP_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U postgres -d mediakit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      # ── (1) apt install داخل الحاوية ───────────────────────
      # bookworm-slim بلا git/ffmpeg/python3 افتراضاً.
      # git: actions/checkout · check:skill-fresh · check:docs-bundle-fresh
      # ffmpeg: verify:render-video-all-templates · verify:breaking-video ·
      #         verify:audio-gate + ffprobe · verify:media-track-gate ·
      #         verify:text-tracks-gate · verify:transitions-gate
      # python3: msgpackr-extract postinstall (يوقف تحذيراً)
      - name: apt install (ca-certificates + git + ffmpeg + python3) داخل الحاوية
        # ca-certificates: بلاها git يفشل بـ«server certificate verification failed»
        #                  عند actions/checkout (bookworm-slim بلاها افتراضاً).
        # git: actions/checkout + check:skill-fresh + check:docs-bundle-fresh.
        # ffmpeg: 6 حرّاس رندر (verify:render-video-all-templates · إلخ).
        # python3: msgpackr-extract postinstall (يوقف تحذيراً).
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends \
            ca-certificates git ffmpeg python3
          update-ca-certificates 2>&1 | tail -3
          git --version
          ffmpeg -version | head -1
          node --version

      # ── (2) Checkout ────────────────────────────────────────
      - name: "Checkout (fetch-depth 0 — لـcheck:skill-fresh)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # git safe.directory داخل container: actions/checkout يضبطها للـstep
      # الخاصّ به فقط. الحرّاس اللاحقة (check:skill-fresh · check:docs-bundle-fresh ·
      # check:dashboard-not-published) تستدعي git من subprocess فتفشل بـ
      # `fatal: detected dubious ownership`. نضبطها globally بدلاً من ذلك.
      # `*` أضمن من مسار محدّد (يعمل بغضّ النظر عن WORKSPACE path).
      - name: git safe.directory (بعد checkout · قبل الحرّاس)
        run: git config --global --add safe.directory '*'

      # ── (3) corepack pnpm ─────────────────────────────────
      # node:20.18.1-bookworm-slim يحوي corepack. لا حاجة لـactions/setup-node.
      - name: corepack pnpm 9.15.4 (يطابق packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      # ── (4) تخبئة متجر pnpm (~60ث توفير) ──────────────────
      - name: تخبئة متجر pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-container-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-container-

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      # ── (5) تشغيل الهجرات على postgres ────────────────────
      # قد يفشل الآن على citext (mkau تعدّ في 150-FRESH-DB) — سيُحلّ دفعة
      # واحدة في هجرة بيد mkapi، لا هنا.
      - name: تشغيل الهجرات على postgres
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.CI_POSTGRES_BOOTSTRAP_PASSWORD }}@postgres:5432/mediakit
        run: pnpm db:migrate

      # ── (7) pnpm test (31 بوابة · حلقة جمع الإخفاقات) ─────
      # عدد البوابات مقروء من `package.json` وقت التشغيل — إن غيّرَه mk،
      # الحلقة تلتقط الرقم الجديد تلقائيّاً.
      - name: pnpm test (31 بوابة · جمع كلّ الإخفاقات)
        # سياسة دائمة (20-CI-BUILD جواب المالك (4)): جمع كلّ الإخفاقات.
        # `if: always()` يشغّل حتى لو فشلت الهجرات — الرؤية تبقى مفتوحة.
        # **لا تُعِد هذا إلى fail-fast ظنّاً أنّه تحسين.**
        if: always()
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.CI_POSTGRES_BOOTSTRAP_PASSWORD }}@postgres:5432/mediakit
          REDIS_URL: redis://redis:6379/3
          BULLMQ_PREFIX: pf-mediakit
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          GATES=$(node -e "
            const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            console.log(p.scripts.test.split('&&').map(s => s.trim()).join('\n'));
          ")
          TOTAL=$(echo "$GATES" | grep -c .)
          echo '===== سلسلة pnpm test ('$TOTAL' بوابة) ====='
          echo "$GATES"
          echo '=========================================='
          FAILED=()
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo ""
            echo "▶ $cmd"
            if eval "$cmd"; then :; else
              echo "  ✗ سقطت: $cmd (exit=$?)"
              FAILED+=("$cmd")
            fi
          done <<< "$GATES"
          echo ""
          echo "===== ملخّص pnpm test: ${#FAILED[@]} من $TOTAL بوابة سقطت ====="
          if [ ${#FAILED[@]} -gt 0 ]; then
            printf '  ✗ %s\n' "${FAILED[@]}"
            exit 1
          fi
          echo "✓ كلّ البوابات ($TOTAL) اجتازت."

      # ── (8) verify:multilang (الوحيدة الآن من ثلاث mkau) ─────
      # verify:auth و verify:tenant-isolation **مؤجَّلتان** بحسب توجيه
      # المالك (بعد قراءة mkau 150-FRESH-DB §الفجوات الصامتة):
      #   • verify:tenant-isolation يفحص `pg_roles WHERE rolbypassrls=true`
      #     يعود صفراً. postgres:16-alpine الخام يبقى فيه `postgres` بـ
      #     BYPASSRLS=true. init/01-roles.sql (على الميني) يضبط
      #     `ALTER ROLE postgres NOBYPASSRLS`، لكنّه لا يجري في CI.
      #   • verify:auth يفحص طبقات auth مع JWT secrets و DB tables — الهجرات
      #     تسقط قبل ذلك (citext + 3 أدوار في 150-FRESH-DB).
      # الإدخال قبل bootstrap صريح = إخضرار بالصدفة. مؤجَّلتان حتى تفتح
      # تذكرة mkapi «bootstrap step» في كلّ بيئة.

      - name: "verify:multilang (mkau · لا خدمة · قياس محلّيّ 1.5s)"
        # قياس محلّيّ (2026-09-11 · macOS m4): 1.5s (0.98s user + 0.11s sys).
        # تخمين mkau في 110-VERIFY-33: ~1s. القيَاس الفعليّ في CI يأتي أدناه.
        # لا خدمة، لا سرّ، لا شبكة — تدخل السلسلة اليوم.
        if: always()
        run: pnpm verify:multilang
