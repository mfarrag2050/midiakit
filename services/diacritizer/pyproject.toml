[project]
name = "diacritizer-service"
version = "0.1.0"
description = "خدمة تشكيل عربي معزولة — FastAPI ملفوفة حول arabic-diacritizer"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "arabic-diacritizer>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diacritizer_service"]
