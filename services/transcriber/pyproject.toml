[project]
name = "transcriber-service"
version = "0.1.0"
description = "خدمة تفريغ عربي مع تزمين — FastAPI ملفوفة حول faster-whisper"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
eval = [
    "datasets>=3.0.0",
    "jiwer>=3.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber_service"]
