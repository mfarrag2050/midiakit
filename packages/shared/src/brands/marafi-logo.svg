<!-- marafi-logo · 300-DEMO-IDENTITY §٤ · عمل أصليّ من وصفٍ هندسيّ.
     مربّع 128×128 مستدير الأركان (radius=24) بلون ink #0E1A24.
     داخله ٣ دعامات رأسيّة بلون surface #F4F1EA، ارتفاعات نازلة من اليمين
     إلى اليسار (70% · 50% · 30% من الارتفاع الداخليّ). عرض كلٍّ سُدس
     العرض الداخليّ، الفراغ بينها = عرضها، أطرافها العليا مستديرة.
     اتّجاه التدرّج من اليمين لليسار يتبع اتّجاه القراءة (RTL).

     الحسابات (128×128 · padding 16):
       inner_w = 128 - 32 = 96
       inner_h = 128 - 32 = 96
       pillar_w = 96 / 6 = 16
       gap = 16
       عدد الوحدات على المحور الأفقيّ: 3 دعائم + 2 فراغ = 5 وحدات = 80
       الهامش الأفقيّ للتوسّط: (96 - 80) / 2 = 8
       start_x = 16 (padding) + 8 = 24
       inner_bottom_y = 128 - 16 = 112

     المواضع (من اليمين لليسار · نازلة):
       pillar 1 (يمين · 70%): x=24 + 32*2=88, height=67.2, top_y=112-67.2=44.8
       pillar 2 (وسط · 50%):  x=24 + 32*1=56, height=48,   top_y=112-48=64
       pillar 3 (يسار · 30%): x=24 + 32*0=24, height=28.8, top_y=112-28.8=83.2

     rx (استدارة الأطراف العليا) = pillar_w / 2 = 8. لأنّ SVG rx يستدير
     الأطراف الأربعة، نحتاج path مع أطراف عليا فقط. البديل الأبسط: rect
     مع rx=8 (كلّ الأركان مستديرة) — الأركان السفليّة تختفي داخل قاعدة
     الحاوية عمليّاً حين تُرسم على خلفيّة ink. لكنّ المطلب دقيق: **الأطراف
     العليا** فقط. نستعمل path مع arc نصفيّ في الأعلى وحواف مستقيمة إلى
     الأسفل. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- الحاوية · مربّع مستدير الأركان -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="#0E1A24"/>

  <!-- الدعامة اليمنى · 70% · x=88 · height=67.2 -->
  <path d="M 88 112 L 88 52.8 A 8 8 0 0 1 104 52.8 L 104 112 Z" fill="#F4F1EA"/>

  <!-- الدعامة الوسطى · 50% · x=56 · height=48 -->
  <path d="M 56 112 L 56 72 A 8 8 0 0 1 72 72 L 72 112 Z" fill="#F4F1EA"/>

  <!-- الدعامة اليسرى · 30% · x=24 · height=28.8 -->
  <path d="M 24 112 L 24 91.2 A 8 8 0 0 1 40 91.2 L 40 112 Z" fill="#F4F1EA"/>
</svg>
