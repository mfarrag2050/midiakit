# pf-mediakit-api dev + test PostgreSQL.
# محكوم بـCLAUDE.md §بيئة مشتركة: بادئة pf-mediakit-، منافذ 19040-19099،
# سياق colima-mediakit حصراً. تُشغَّل عبر bin/mk من الجذر.
#
# مستخدما القاعدة (migration_user، app_user) يُنشآن في init/01-roles.sql
# — كلاهما NOSUPERUSER NOBYPASSRLS. ADR-011 + قاعدة PHASES-api.md
# «لا BYPASSRLS إطلاقاً» مضمونة قبل أول migration.

name: pf-mediakit

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: pf-mediakit-postgres-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:19041:5432"
    environment:
      POSTGRES_DB: mediakit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bootstrap_only_never_used_by_app
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - pf-mediakit-postgres-dev-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediakit"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pf-mediakit-net

  postgres-test:
    image: postgres:16-alpine
    container_name: pf-mediakit-postgres-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:19042:5432"
    environment:
      POSTGRES_DB: mediakit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bootstrap_only_never_used_by_app
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - pf-mediakit-postgres-test-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediakit_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pf-mediakit-net

  # MinIO — S3-compatible للتخزين في dev/test (A11-STORAGE).
  # المفاتيح hardcoded عمداً — dev-only. الإنتاج على R2/S3 حقيقي
  # بمفاتيح خارج المستودع (superRefine في config يفشل بدونها في production).
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: pf-mediakit-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:19043:9000"      # S3 API
      - "127.0.0.1:19044:9001"      # console (لتصفح ملفات dev)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - pf-mediakit-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pf-mediakit-net

  # minio-init — one-shot: يُنشئ bucket ثم يخرج. يُشغَّل مع db:up.
  # يعتمد على minio health — يبدأ فقط بعد اكتمال اقلاع MinIO.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: pf-mediakit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mk-assets-dev &&
      mc mb --ignore-existing local/mk-assets-test &&
      mc anonymous set none local/mk-assets-dev &&
      mc anonymous set none local/mk-assets-test &&
      echo '✓ mk-assets-dev + mk-assets-test buckets ready'
      "
    networks:
      - pf-mediakit-net

networks:
  pf-mediakit-net:
    name: pf-mediakit-net
    driver: bridge

volumes:
  pf-mediakit-postgres-dev-data:
    name: pf-mediakit-postgres-dev-data
  pf-mediakit-postgres-test-data:
    name: pf-mediakit-postgres-test-data
  pf-mediakit-minio-data:
    name: pf-mediakit-minio-data
