# pf-mediakit-show — بيئة العرض (Showroom) المعزولة عن التطوير.
#
# قاعدة حاكمة (docs/SHOWROOM.md · §1):
#   • قاعدة بيانات مستقلّة (mediakit_show) — لا تشارك dev/test إطلاقاً.
#   • تخزين أصول مستقلّ (mk-assets-show) — bucket آخر.
#   • أسرار مولَّدة لها وحدها في .env.show (خارج git).
#   • منافذ خاصّة: 19070 (API) · 19071 (Studio) · 19062-19065 (خدمات).
#   • بذرة عرضٍ مُختلَقة — لا بيانات عميلٍ حقيقيّ.
#
# البادئة `pf-mediakit-show-` تحمي من أيّ لبس مع stack التطوير
# (`pf-mediakit-`) — كلاهما يعمل في سياق colima-mediakit نفسه.
#
# تُشغَّل عبر: `bin/mk show up` (يستدعي docker compose -p pf-mediakit-show).
# دورا القاعدة (migration_user, app_user, control_plane_user, auth_lookup)
# يُنشآن في init-show/01-roles.sh (منفصل عن init/ · بكلمات مولَّدة من
# .env.show لا كلمات dev المشتركة) — _AMEND-SHOWROOM-PORTS §3.

name: pf-mediakit-show

services:
  postgres-show:
    image: postgres:16-alpine
    container_name: pf-mediakit-show-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:19062:5432"
    environment:
      POSTGRES_DB: mediakit_show
      POSTGRES_USER: postgres
      # كلمات مرور مولَّدة من bin/mk-show → .env.show → compose --env-file.
      # POSTGRES_PASSWORD = bootstrap postgres user (init فقط، لا التطبيق).
      # الثلاث الباقية تُقرأها init-show/01-roles.sh لإنشاء أدوار التطبيق.
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:?POSTGRES_ROOT_PASSWORD مطلوب — شغّل bin/mk show up}
      MIGRATION_USER_PASSWORD: ${MIGRATION_USER_PASSWORD:?MIGRATION_USER_PASSWORD مطلوب}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD مطلوب}
      CONTROL_PLANE_USER_PASSWORD: ${CONTROL_PLANE_USER_PASSWORD:?CONTROL_PLANE_USER_PASSWORD مطلوب}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - pf-mediakit-show-postgres-data:/var/lib/postgresql/data
      # init-show/ **ليس** init/ — أدوار الشوروم بكلمات مستقلّة
      # (_AMEND-SHOWROOM-PORTS §3). init/*.sql فيه كلمات dev المشتركة.
      - ./postgres/init-show:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediakit_show"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pf-mediakit-show-net

  redis-show:
    image: redis:7-alpine
    container_name: pf-mediakit-show-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:19063:6379"
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pf-mediakit-show-net

  minio-show:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: pf-mediakit-show-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:19064:9000"      # S3 API
      - "127.0.0.1:19065:9001"      # console
    environment:
      # اعتماد مولَّد للشوروم وحده — لا `minioadmin:minioadmin` المشترك مع dev.
      # يُقرأ من .env.show عبر --env-file (يُنشئه bin/mk-show عند أوّل up).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER مطلوب — شغّل bin/mk show up}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD مطلوب}
    volumes:
      - pf-mediakit-show-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pf-mediakit-show-net

  # one-shot: ينشئ bucket العرض ثمّ يخرج.
  minio-show-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: pf-mediakit-show-minio-init
    depends_on:
      minio-show:
        condition: service_healthy
    environment:
      MK_ROOT_USER: ${MINIO_ROOT_USER}
      MK_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # نمرّر الاعتماد كـenv ثمّ نقرأه في mc alias set — لا نضعه نصّاً في السطر.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-show:9000 \"$$MK_ROOT_USER\" \"$$MK_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/mk-assets-show &&
      mc anonymous set none local/mk-assets-show &&
      echo '✓ mk-assets-show bucket ready'
      "
    networks:
      - pf-mediakit-show-net

networks:
  pf-mediakit-show-net:
    name: pf-mediakit-show-net
    driver: bridge

volumes:
  pf-mediakit-show-postgres-data:
    name: pf-mediakit-show-postgres-data
  pf-mediakit-show-minio-data:
    name: pf-mediakit-show-minio-data
