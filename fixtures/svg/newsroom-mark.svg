<?xml version="1.0" encoding="UTF-8"?>
<!--
  علامة نموذجية لغرفة أخبار — من إنتاج المشروع (لا مصدر خارجي).
  الأشكال: دائرة عرض تُغلَّف صحيفة مطوية (rect دوّار) + خطّان أفقيّان
  يمثّلان النصّ. كل الألوان مرتبطة بالهوية عبر data-brand-fill /
  data-brand-stroke — بلا لون ثابت.

  الرخصة: ملك المشروع (للاختبار). فيكستشر يُشحن مع المستودع كي تختبر
  البوابة رسم SVG على قماش ثابت.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- خلفية دائرية — عنبر الهوية -->
  <circle cx="100" cy="100" r="90" data-brand-fill="accent" opacity="0.15"/>

  <!-- إطار الصحيفة — مستطيل مدوّر باللون النصّي -->
  <g transform="translate(50 55)">
    <rect x="0" y="0" width="100" height="90" rx="6" ry="6"
          data-brand-fill="surface"
          data-brand-stroke="text" stroke-width="3"/>

    <!-- خطوط النصّ داخل الصحيفة -->
    <line x1="12" y1="20" x2="88" y2="20" data-brand-stroke="text" stroke-width="4"/>
    <line x1="12" y1="36" x2="76" y2="36" data-brand-stroke="text" stroke-width="3"/>
    <line x1="12" y1="50" x2="68" y2="50" data-brand-stroke="text" stroke-width="3"/>

    <!-- شريط عاجل سفلي — يرتبط بـurgentBg -->
    <rect x="12" y="62" width="76" height="18" rx="3" ry="3"
          data-brand-fill="urgentBg"/>

    <!-- زخرفة قوس — يختبر تفكيك A إلى Bézier -->
    <path d="M 20 100 A 30 15 0 0 1 80 100" fill="none"
          data-brand-stroke="accent" stroke-width="2.5"/>
  </g>

  <!-- ثلاث نقاط علوية — تختبر التكرار في وسط الشكل -->
  <g transform="translate(100 30)">
    <circle cx="-14" cy="0" r="3" data-brand-fill="accent"/>
    <circle cx="0"   cy="0" r="3" data-brand-fill="accent"/>
    <circle cx="14"  cy="0" r="3" data-brand-fill="accent"/>
  </g>
</svg>
